[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openriak"
version = "0.1.0"
description = "OpenRiak HTTP client"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "OpenRiak" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/OpenRiak/riak_clients"
Repository = "https://github.com/OpenRiak/riak_clients"
Changelog = "https://github.com/OpenRiak/riak_clients/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/openriak"]
